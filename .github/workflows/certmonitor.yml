name: Certificate monitoring

on:
  schedule:
    - cron: '39 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certmonitor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.5"
          - "8.6"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@2.40.0
        with:
          coverage: none
          php-version: ${{ matrix.php-version }}
      - run: php app/bin/certmonitor.php --colors --no-ipv6
        env:
          CERTMONITOR_USER: ${{ secrets.CERTMONITOR_USER }}
          CERTMONITOR_KEY: ${{ secrets.CERTMONITOR_KEY }}

  heartbeat:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - certmonitor
    steps:
      - run: curl --no-progress-meter ${{ secrets.CERTMONITOR_HEARTBEAT_URL }}

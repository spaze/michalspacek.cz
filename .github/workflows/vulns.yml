name: Dependency vulnz checker

on:
  push:
  schedule:
    - cron: '25 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer-vulnz:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: symfonycorp/security-checker-action@v5
      with:
          lock: app/composer.lock
    - uses: symfonycorp/security-checker-action@v5
      with:
          lock: lambda-security-txt/composer.lock
    - uses: symfonycorp/security-checker-action@v5
      with:
          lock: dev-tools/composer.lock

  composer-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version:
          - "8.5"
          - "8.6"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@2.40.0
        with:
          coverage: none
          php-version: ${{ matrix.php-version }}
      - run: composer --working-dir=dev-tools install
      - run: make --directory=app composer-audit

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: make --directory=app npm-audit

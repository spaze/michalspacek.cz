name: PHP tests for lambda-security-txt

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lambda-security-txt:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version:
          - "8.5"
          - "8.6"
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: shivammathur/setup-php@2.40.0
      with:
        coverage: none
        php-version: ${{ matrix.php-version }}
    - run: composer --working-dir=dev-tools install
    - run: make --directory=lambda-security-txt test

name: PHP tests for lambda-security-txt

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lambda-security-txt:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version:
          - "8.5"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        coverage: none
        php-version: ${{ matrix.php-version }}
    - run: composer --working-dir=dev-tools install
    - run: make --directory=lambda-security-txt test

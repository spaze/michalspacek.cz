map $scheme $hsts_header {
    https "max-age=31536000; includeSubDomains; preload";
    default "";
}

# A multipart body is refused before PHP parses it, so a new domain refuses them by default. A domain with forms
# that upload files sets this to 0 in its server block. The match ignores case, like PHP's does
map $content_type $multipart_refused {
    "~*^multipart/" 1;
    default 0;
}

# One key per /64 for IPv6, one per address for IPv4
# nginx writes an address with its longest run of two or more zero groups as ::, so the first four groups are
# not always the first four written, and the forms where :: stands in for part of them come first
map $remote_addr $rate_limit_network {
    default $remote_addr;
    "~^(?<first>[^:]+)::(?<fourth>[^:]+):[^:]+:[^:]+:[^:]+:[^:]+$" "$first:0:0:$fourth::/64";
    "~^::(?<third>[^:]+):(?<fourth>[^:]+):[^:]+:[^:]+:[^:]+:[^:]+$" "0:0:$third:$fourth::/64";
    "~^::(?<fourth>[^:]+):[^:]+:[^:]+:[^:]+:[^:]+$" "0:0:0:$fourth::/64";
    "~^::" "::/64";
    "~^(?<network>[^:]+:[^:]+:[^:]+:[^:]+):" "$network::/64";
    "~^(?<network>[^:]+:[^:]+:[^:]+)::" "$network::/64";
    "~^(?<network>[^:]+:[^:]+)::" "$network::/64";
    "~^(?<network>[^:]+)::" "$network::/64";
}

# An empty key means the request is not rate limited
map "$request_method $request_uri" $rate_limit_key {
    "GET /" "";
    "HEAD /" "";
    default $rate_limit_network;
}

limit_req_zone $rate_limit_key zone=securitytxtvalidator:10m rate=6r/m;

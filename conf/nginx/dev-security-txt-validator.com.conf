server {
    listen 127.0.0.1:80;
    server_name security-txt-validator.com.test;
    include /srv/www/michalspacek.cz/conf/nginx/common-securitytxtvalidator.com.conf;
    include /srv/www/michalspacek.cz/conf/nginx/common-headers-redir&notfound.conf;
    return 301 https://$server_name$request_uri;
}

server {
    listen 127.0.0.1:80;
    server_name www.security-txt-validator.com.test;
    include /srv/www/michalspacek.cz/conf/nginx/common-securitytxtvalidator.com.conf;
    include /srv/www/michalspacek.cz/conf/nginx/common-headers-redir&notfound.conf;
    return 301 https://$server_name$request_uri;
}

server {
    listen 127.0.0.1:443 ssl;
    http2 on;
    server_name .security-txt-validator.com.test;
    include /srv/www/michalspacek.cz/conf/nginx/dev-https-michalspacek.cz.conf;
    include /srv/www/michalspacek.cz/conf/nginx/common-securitytxtvalidator.com.conf;
    include /srv/www/michalspacek.cz/conf/nginx/common-headers-redir&notfound.conf;
    return 301 https://securitytxtvalidator.com.test$request_uri;
}

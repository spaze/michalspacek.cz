# Include this in a domain's `location = /app.php` block to allow only the addresses listed in /etc/nginx/allow-list.conf
# on the server, everyone else gets a 403. Use it for e.g. a site before its launch. The file looks like this:
#
#   allow 192.0.2.1;
#   allow 2001:db8:1234:5678::/64;
#   deny all;
#
# Other locations like .well-known are not affected, so a certificate renews regardless. The glob keeps the nginx
# configuration valid even if the file does not exist
include /etc/nginx/allow-list*.conf;
